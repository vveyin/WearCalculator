# 本地构建说明：
# 这台机器上已经解压好了 Gradle 8.7（D:\gradle-home\wrapper\dists\gradle-8.7-bin）。
# 用  GRADLE_USER_HOME=D:\gradle-home  跑 gradlew 就会直接用它，不会去下载发行包。
# 原来的 9.3.1 发行包在本机下不下来（下载一直卡在 0 字节），所以本地构建统一用 8.7，
# AGP 也相应降到 8.5.2（见 gradle/libs.versions.toml）。
# 要把项目恢复到官方原版配置：把下面的 distributionUrl 换回
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
#   distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
